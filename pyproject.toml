[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest"
version = "0.1.0"
description = "Detect artifacts and inscriptions, identify ancient scripts, transcribe, and explain their history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "transformers>=4.40", "pytesseract>=0.3.10"]
llm = ["anthropic>=0.40"]
app = ["gradio>=4.30"]
dev = ["pytest>=8.0"]
all = ["palimpsest[ml,llm,app,dev]"]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
